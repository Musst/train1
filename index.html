<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8" >
    <title>Train & Go</title>
    <link href="CSS/styles.css" rel="stylesheet" >
    <link href="CSS/index.css" rel="stylesheet" >
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope&family=Montserrat&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <nav>
            <img src="images/images.png" alt="Logo Train&Go" >
            <div>
                <a href="index.html">Accueil</a>
                <a href="a-propos.html">A propos</a>
                <a href="portfolio.html">Mes réservations</a>
            </div>
        </nav>
    </header>
    <main>
        <section class="accueil-introduction">
            <div>
                <h1>Bienvenue sur Train & Go</h1>
                
                <a href="#contact" class="cta">Une envie de partir ? N'hésitez plus ! </a>
            </div>
        </section>
        <section class="accueil-photos">
            <h2>Les destinations les plus recherchées</h2>
            <div>
                <img src="images/3 giorni a Parigi Tour Eiffel.avif" alt="Paris" >
                <img src="images/Bastia-le-joyau-de-la-Corse.jpg" alt="La Corse" >
                <img src="images/vieux_port_la_rochelle_remi_allain_448842cf49.jpg" alt="La Rochelle" >
            </div>
            <div>
                <img src="images/lille-panorama.jpg" alt="Lille" >
                <img src="images/french-immersion-marseille-port.jpg" alt="Marseille" >
                <img src="images/avif.jpg" alt="Toulouse" >
            </div>
        </section>
        <section id="contact" class="section-contact"> 
            <h2>Parlons de votre envie d'escapade</h2>
            <form method="get" action="#">
                <div class="form-nom-email">
                    <div class="form-column">
                        <label for="nom">nom</label>
                        <input type="text" name="nom" id="nom" >
                    </div>
                    <div class="form-column">
                        <label for="email">email</label>
                        <input type="email" name="email" id="email" >
                    </div>
                </div>
                <label for="message">destination souhaitée</label>
                <textarea name="message" id="message" rows="10"></textarea>
                <input type="submit" value="ENVOYER" class="cta" >
            </form>
        </section>
    </main>
    <footer>
        <img src="images/images.png" alt="Logo Train&Go" >
        <div>
            <a target="_blank" href="https://twitter.com/" class="lien-icone">
                <img src="images/twitter.png" alt="Logo Twitter" >
            </a>
            <a target="_blank" href="https://www.instagram.com/" class="lien-icone">
                <img src="images/instagram.png" alt="Logo Instagram" >
            </a>
        </div>
    </footer>
</body>

</html>
